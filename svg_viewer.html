<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SVG Reference Viewer</title>
  <style>
    body {
      background-color: #111;
      color: #fff;
      font-family: sans-serif;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 40px;
      align-items: center;
    }
    .svg-container {
      background: #000;
      border: 2px solid #333;
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h2 {
      margin-bottom: 10px;
      color: #8FAAFF;
    }
    img {
      max-width: 414px;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="svg-container">
    <h2>1. BlinkedIt AI Home.svg</h2>
    <img src="BlinkedIt AI Home.svg" alt="Home SVG">
  </div>

  <div class="svg-container">
    <h2>2. Subscription Review.svg</h2>
    <img src="Subscription Review.svg" alt="Subscription SVG">
  </div>

  <div class="svg-container">
    <h2>3. Friends Circle.svg</h2>
    <img src="Friends Circle.svg" alt="Friends SVG">
  </div>
</body>
</html>
