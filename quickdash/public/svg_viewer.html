<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SVG Reference Viewer</title>
  <style>
    body {
      background-color: #051424;
      color: #fff;
      font-family: sans-serif;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 40px;
      align-items: center;
    }
    .svg-container {
      background: #122131;
      border: 2px solid #273647;
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h2 {
      margin-bottom: 10px;
      color: #8FAAFF;
    }
    img {
      max-width: 414px;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="svg-container">
    <h2>1. Home Screen Reference</h2>
    <img src="/BlinkedIt%20AI%20Home.svg" alt="Home SVG">
  </div>

  <div class="svg-container">
    <h2>2. Subscription Review Reference</h2>
    <img src="/Subscription%20Review.svg" alt="Subscription SVG">
  </div>

  <div class="svg-container">
    <h2>3. Friends Circle Reference</h2>
    <img src="/Friends%20Circle.svg" alt="Friends SVG">
  </div>
</body>
</html>
